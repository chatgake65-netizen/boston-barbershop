backend:
  name: github
  repo: chatgake65-netizen/boston-barbershop
  branch: main

site_url: https://boston-barbershop.netlify.app
display_url: https://boston-barbershop.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content"
    label: "Site content"
    files:
      - name: "services"
        label: "Services & Prices"
        file: "data/services.json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Price (₸)", name: "price", widget: "number", value_type: "int", min: 0 }
