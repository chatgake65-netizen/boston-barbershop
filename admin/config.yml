backend:
  name: github
  repo: chatgake65-netizen/boston-barbershop
  branch: main

site_url: https://boston-barbershop.netlify.app
display_url: https://boston-barbershop.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "content"
    label: "Site content"
    files:
      - name: "services"
        label: "Services & Prices"
        file: "data/services.json"
        fields:
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
              - { label: "Price (₸)", name: "price", widget: "number", value_type: "int", min: 0 }
      - name: "contact"
        label: "Contacts & WhatsApp"
        file: "data/contact.json"
        fields:
          - { label: "WhatsApp number (digits only, with country code, e.g. 77011234567)", name: "whatsapp", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "string", required: false }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Working hours", name: "hours", widget: "string", required: false }
          - { label: "Instagram / Telegram", name: "social", widget: "string", required: false }
